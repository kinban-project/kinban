<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KINBAN 本人用AIアシスト</title>
  <style>
    :root { color: #173332; background: #f7faf7; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    main { min-height: 100vh; padding: 28px 18px; display: flex; justify-content: center; }
    .chat-card { width: min(960px, 100%); min-height: calc(100vh - 56px); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #cfe4df; border-radius: 18px; background: #fff; box-shadow: 0 12px 35px rgba(31, 70, 55, .10); }
    .chat-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 26px 28px 20px; border-bottom: 1px solid #dfeae5; }
    h1 { margin: 0 0 8px; font-size: clamp(22px, 4vw, 32px); }
    .eyebrow { margin: 0 0 8px; color: #26747a; letter-spacing: .16em; font-size: 11px; font-weight: 800; }
    .meta { margin: 0; color: #55716a; font-size: 13px; line-height: 1.6; }
    .new-conversation { margin: 0; padding: 9px 12px; border: 1px solid #cfe4df; border-radius: 9px; color: #26747a; background: #fff; cursor: pointer; white-space: nowrap; font-size: 12px; }
    .new-conversation:hover { background: #f0f8f1; }
    button:disabled { opacity: .5; cursor: wait; }
    .status { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 18px 28px 0; padding: 12px 14px; border: 1px solid #cfe4df; border-radius: 12px; background: #f0f8f1; font-size: 13px; }
    .status strong { color: #23633c; }
    .status.expired, .status.error { color: #8b4c4c; background: #fff4f2; border-color: #efc4bc; }
    .chat-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); flex: 1; min-height: 0; margin-top: 18px; }
    .quick-actions { padding: 20px 14px; border-right: 1px solid #dfeae5; background: #fbfdfb; }
    .quick-actions h2 { margin: 0 0 12px; font-size: 13px; }
    .samples { display: grid; gap: 8px; }
    .sample { width: 100%; margin: 0; padding: 9px 10px; border: 1px solid #cfe4df; border-radius: 9px; color: #26747a; background: #fff; cursor: pointer; font-size: 12px; text-align: left; }
    .sample:hover { background: #edf7f5; }
    .conversation { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .messages { flex: 1; min-height: 300px; padding: 24px 28px; overflow-y: auto; }
    .welcome { padding: 58px 10px 30px; text-align: center; color: #55716a; }
    .welcome-mark { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 14px; color: #fff; background: #26747a; font-weight: 800; font-size: 22px; }
    .welcome h2 { margin: 0 0 8px; color: #173332; font-size: 20px; }
    .welcome p { margin: 0; font-size: 13px; line-height: 1.6; }
    .message-row { max-width: 84%; margin: 0 0 20px; }
    .message-row.user { margin-left: auto; }
    .message-label { margin: 0 0 6px; color: #55716a; font-size: 11px; }
    .message-row.user .message-label { text-align: right; }
    .message-bubble { padding: 12px 14px; border: 1px solid #d4e4df; border-radius: 13px; border-bottom-left-radius: 3px; background: #f0f8f1; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; font-size: 14px; }
    .message-row.user .message-bubble { border-color: #26747a; border-bottom-right-radius: 3px; border-bottom-left-radius: 13px; color: #fff; background: #26747a; }
    .error-message .message-bubble { border-color: #efc4bc; color: #8b4c4c; background: #fff4f2; }
    .retry { display: block; margin: 10px 0 0; padding: 6px 9px; border: 1px solid #dfa69d; border-radius: 7px; color: #8b4c4c; background: #fff; cursor: pointer; font-size: 12px; }
    .composer { display: flex; gap: 10px; padding: 16px 28px; border-top: 1px solid #dfeae5; background: #fff; }
    textarea { flex: 1; min-height: 50px; padding: 12px; border: 1px solid #ccd9d2; border-radius: 12px; color: inherit; resize: none; }
    textarea:focus { outline: 2px solid #a5d4cf; outline-offset: 1px; border-color: #26747a; }
    .send { min-width: 72px; margin: 0; border: 0; border-radius: 11px; color: #fff; background: #173332; cursor: pointer; font-weight: 700; }
    .chat-footer { padding: 0 28px 18px; color: #55716a; font-size: 11px; }
    .hidden { display: none; }
    @media (max-width: 640px) { main { padding: 0; } .chat-card { min-height: 100vh; border: 0; border-radius: 0; } .chat-header { padding: 22px 18px 18px; } .status { margin-left: 18px; margin-right: 18px; } .chat-layout { display: flex; flex-direction: column; } .quick-actions { padding: 12px 18px; border-right: 0; border-bottom: 1px solid #dfeae5; overflow-x: auto; } .quick-actions h2 { margin-bottom: 8px; } .samples { display: flex; width: max-content; } .sample { width: auto; white-space: nowrap; } .messages { min-height: 310px; padding: 20px 18px; } .message-row { max-width: 94%; } .composer { position: sticky; bottom: 0; padding: 12px 18px; } .chat-footer { padding: 0 18px 16px; } }
    @media (max-width: 380px) { .chat-header { gap: 10px; } .new-conversation { padding: 8px; } .composer { gap: 6px; } .send { min-width: 58px; } }
  </style>
</head>
<body>
  <main>
    <section class="chat-card">
      <header class="chat-header">
        <div>
          <p class="eyebrow" id="eyebrow">KINBAN MEMBER ASSIST</p>
          <h1 id="page-title">KINBAN 本人用AIアシスト</h1>
          <p id="page-description" class="meta">本人のシフト希望・勤務申告・管理者への連絡・業務ガイドを確認できます。</p>
        </div>
        <button id="new" class="new-conversation" type="button">新しい相談</button>
      </header>
      <section id="status" class="status"><strong>接続を確認しています…</strong></section>
      <section id="app" class="chat-layout hidden">
        <aside class="quick-actions" aria-label="よく使う操作"><h2>よく使う操作</h2><div id="sample-prompts" class="samples"></div></aside>
        <div class="conversation">
          <div id="messages" class="messages" aria-live="polite"></div>
          <form id="composer" class="composer"><textarea id="message" placeholder="メッセージを入力…" rows="2"></textarea><button id="run" class="send" type="submit">送信</button></form>
        </div>
      </section>
      <footer id="footer" class="chat-footer">会話履歴はこのブラウザを開いている間だけ保持されます。</footer>
    </section>
  </main>
  <script>
    let history = [], ready = false, loading = false, sessionMode = 'member', lastUserMessage = '';
    const status = document.querySelector('#status'), app = document.querySelector('#app'), message = document.querySelector('#message'), messages = document.querySelector('#messages'), run = document.querySelector('#run'), composer = document.querySelector('#composer');
    const kinbanOrigin = (() => { try { return document.referrer ? new URL(document.referrer).origin : ''; } catch { return ''; } })();
    const memberPrompts = [['今日のシフト', '今日のシフトを確認して'], ['受付中の希望', '受付中のシフト希望を確認して'], ['水曜を休み希望', '水曜日を休み希望で提出して'], ['勤務申告状況', '今月の勤務申告状況を確認して'], ['勤務を開始', '勤務を開始して'], ['管理者へ連絡', '今日行けなくなったので管理者に連絡したい'], ['業務ガイド', 'この業務の手順をガイドから教えて']];
    const operationsPrompts = [['割当案を確認', '割当案の不足・希望との差分・労務注意を確認して'], ['割当案を作成', '現在の条件でシフト割当案を作成して'], ['未処理の勤怠', '未処理の日次・月次承認候補を確認して'], ['お知らせ文を作成', '全体向けのお知らせ文案を作って'], ['急な欠勤を相談', '急な欠勤が出た場合の代替案を確認して']];
    function showError(text) { status.className = 'status error'; status.textContent = text; }
    function escapeHtml(text) { const node = document.createElement('span'); node.textContent = text; return node.innerHTML; }
    function agentLabel() { return sessionMode === 'operations' ? '運営支援AI' : '本人用AIアシスト'; }
    function renderMessages() {
      if (!history.length && !loading) { const guide = sessionMode === 'operations' ? '運営状況、シフト割当、勤怠承認などを尋ねてください。' : '業務ガイド、お知らせ、シフト、勤怠などを尋ねてください。'; messages.innerHTML = '<div class="welcome"><div class="welcome-mark">K</div><h2>何を確認しましょうか？</h2><p>' + guide + '</p></div>'; }
      else { messages.innerHTML = history.map((item) => '<div class="message-row ' + item.role + '"><div class="message-label">' + (item.role === 'user' ? 'あなた' : agentLabel()) + '</div><div class="message-bubble">' + escapeHtml(item.content) + '</div></div>').join(''); if (loading) messages.insertAdjacentHTML('beforeend', '<div class="message-row assistant"><div class="message-label">' + agentLabel() + '</div><div class="message-bubble">KINBANの状態を確認中…</div></div>'); }
      messages.scrollTop = messages.scrollHeight;
    }
    function showChatError(text) { messages.insertAdjacentHTML('beforeend', '<div class="message-row assistant error-message"><div class="message-label">エラー</div><div class="message-bubble">' + escapeHtml(text) + '<button id="retry" class="retry" type="button">もう一度送信</button></div></div>'); document.querySelector('#retry')?.addEventListener('click', retryLastMessage); messages.scrollTop = messages.scrollHeight; }
    function renderPrompts() { const prompts = sessionMode === 'operations' ? operationsPrompts : memberPrompts, promptArea = document.querySelector('#sample-prompts'); promptArea.innerHTML = ''; prompts.forEach(([label, value]) => { const button = document.createElement('button'); button.type = 'button'; button.className = 'sample'; button.textContent = label; button.addEventListener('click', () => { message.value = value; message.focus(); }); promptArea.append(button); }); }
    async function loadSession() {
      try {
        const response = await fetch('/api/session', { credentials: 'include' }); if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || 'KINBANから接続してください。');
        const data = await response.json(), operations = data.mode === 'operations'; sessionMode = data.mode;
        document.querySelector('#eyebrow').textContent = operations ? 'KINBAN OPERATIONS AI' : 'KINBAN MEMBER ASSIST'; document.querySelector('#page-title').textContent = operations ? 'KINBAN 運営支援AI' : 'KINBAN 本人用AIアシスト'; document.querySelector('#page-description').textContent = operations ? 'シフト作成・割当・公開、勤怠承認、連絡やお知らせなど、管理者の運営業務を支援します。' : '本人のシフト希望・勤務申告・管理者への連絡・業務ガイドを確認できます。'; document.querySelector('#footer').textContent = 'KINBAN MCP · ' + (operations ? '管理者向け' : 'メンバー用') + ' · 会話履歴はこのブラウザを開いている間だけ保持されます。';
        ready = true; status.className = 'status'; status.innerHTML = '<strong>接続中</strong><span>' + escapeHtml(data.groupId) + '</span><span>' + escapeHtml(data.memberName) + '（' + (operations ? '管理者向け' : 'メンバー用') + '）</span><span id="remaining"></span>'; app.classList.remove('hidden'); renderPrompts(); renderMessages(); updateRemaining(data.remainingSeconds);
      } catch (error) { showError(error.message || '接続を確認できません。'); }
    }
    function updateRemaining(seconds) { const node = document.querySelector('#remaining'); if (!node) return; const timer = () => { const min = Math.floor(seconds / 60), sec = seconds % 60; node.textContent = '残り接続時間 ' + min + ':' + String(sec).padStart(2, '0'); if (seconds <= 0) { ready = false; showError('接続時間が終了しました。KINBANから再接続してください。'); } seconds -= 1; }; timer(); window.setInterval(timer, 1000); }
    async function sendMessage(messageOverride, historyOverride) {
      const text = (messageOverride ?? message.value).trim(); if (!ready || loading || !text) return;
      const priorHistory = historyOverride ?? history; history = [...priorHistory, { role: 'user', content: text }]; lastUserMessage = text; message.value = ''; loading = true; run.disabled = true; renderMessages();
      try { const response = await fetch('/api/chat', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: text, history: priorHistory }) }); const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'AIアシストの実行に失敗しました。'); history = [...history, { role: 'assistant', content: data.answer }]; }
      catch (error) { loading = false; run.disabled = false; renderMessages(); showChatError(error.message || '実行に失敗しました。'); return; }
      loading = false; run.disabled = false; renderMessages();
    }
    function retryLastMessage() { if (loading || !lastUserMessage) return; const priorHistory = history.at(-1)?.role === 'user' && history.at(-1)?.content === lastUserMessage ? history.slice(0, -1) : history; sendMessage(lastUserMessage, priorHistory); }
    document.querySelector('#new').addEventListener('click', () => { if (loading) return; history = []; lastUserMessage = ''; message.value = ''; renderMessages(); message.focus(); });
    composer.addEventListener('submit', (event) => { event.preventDefault(); sendMessage(); }); message.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } });
    window.addEventListener('message', async (event) => { if (event.source !== window.opener || event.data?.type !== 'kinban-agent-handoff' || !kinbanOrigin || event.origin !== kinbanOrigin) return; try { const response = await fetch('/api/session', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'include', body: JSON.stringify(event.data) }); if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || 'KINBANの接続を確認できません。'); await loadSession(); window.opener?.postMessage({ type: 'kinban-agent-session-ready' }, kinbanOrigin); } catch (error) { showError(error.message || 'KINBANの接続を確認できません。'); } });
    async function consumeHandoff() { const handoff = new URLSearchParams(window.location.search).get('handoff'); if (!handoff) return false; const response = await fetch('/api/session/handoff', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'include', body: JSON.stringify({ handoff }) }); if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || 'KINBANからの引渡しを確認できません。'); window.history.replaceState({}, document.title, window.location.pathname); return true; }
    if (kinbanOrigin) window.opener?.postMessage({ type: 'kinban-agent-ready' }, kinbanOrigin); consumeHandoff().then(() => loadSession()).catch((error) => showError(error.message || 'KINBANからの引渡しを確認できません。'));
  </script>
</body>
</html>
